# Compila el APK en GitHub sin instalar nada en tu PC.
# Sube este proyecto a un repositorio de GitHub y ve a Actions → "Compilar APK" → Run workflow.
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MiIPTV-apk
          path: app/build/outputs/apk/release/*.apk
